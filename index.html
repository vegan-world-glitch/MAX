<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: black; /* 전체 배경을 검정색으로 설정 */
    }

    .container {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* 5x5 grid */
      grid-template-rows: repeat(5, 1fr); /* 5x5 grid */
      gap: 4px; /* 4픽셀 간격 */
      height: calc(100vh - 16px); /* 전체 높이에서 간격 제외 */
      width: calc(100vw - 16px); /* 전체 너비에서 간격 제외 */
      border: 2px solid black; /* 전체 테두리를 검정색으로 설정 */
      margin: 8px; /* 전체 테두리와 내부 요소 사이 간격 */
    }

    .video {
      position: relative;
      overflow: hidden;
      background-color: black; /* 각 비디오 컨테이너의 배경을 검정색으로 설정 */
    }

    .video iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 비디오 1 -->
    <div class="video" id="video1"></div>
    <!-- 비디오 2 -->
    <div class="video" id="video2"></div>
    <!-- 비디오 3 -->
    <div class="video" id="video3"></div>
    <!-- 비디오 4 -->
    <div class="video" id="video4"></div>
    <!-- 비디오 5 -->
    <div class="video" id="video5"></div>
    <!-- 비디오 6 -->
    <div class="video" id="video6"></div>
    <!-- 비디오 7 -->
    <div class="video" id="video7"></div>
    <!-- 비디오 8 -->
    <div class="video" id="video8"></div>
    <!-- 비디오 9 -->
    <div class="video" id="video9"></div>
    <!-- 비디오 10 -->
    <div class="video" id="video10"></div>
    <!-- 비디오 11 -->
    <div class="video" id="video11"></div>
    <!-- 비디오 12 -->
    <div class="video" id="video12"></div>
    <!-- 비디오 13 -->
    <div class="video" id="video13"></div>
    <!-- 비디오 14 -->
    <div class="video" id="video14"></div>
    <!-- 비디오 15 -->
    <div class="video" id="video15"></div>
    <!-- 비디오 16 -->
    <div class="video" id="video16"></div>
    <!-- 비디오 17 -->
    <div class="video" id="video17"></div>
    <!-- 비디오 18 -->
    <div class="video" id="video18"></div>
    <!-- 비디오 19 -->
    <div class="video" id="video19"></div>
    <!-- 비디오 20 -->
    <div class="video" id="video20"></div>
    <!-- 비디오 21 -->
    <div class="video" id="video21"></div>
    <!-- 비디오 22 -->
    <div class="video" id="video22"></div>
    <!-- 비디오 23 -->
    <div class="video" id="video23"></div>
    <!-- 비디오 24 -->
    <div class="video" id="video24"></div>
    <!-- 비디오 25 -->
    <div class="video" id="video25"></div>
  </div>

  <script>
    // YouTube video URL
    const videoURL = "https://www.youtube.com/embed/qHIk_qdNFy0?autoplay=1&mute=1&controls=1&loop=1&playlist=qHIk_qdNFy0";

    // Create a single video element (source)
    const sourceVideoElement = document.createElement('iframe');
    sourceVideoElement.src = videoURL;
    sourceVideoElement.frameBorder = 0;
    sourceVideoElement.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    sourceVideoElement.allowFullscreen = true;

    // Append the source video to each video container
    for (let i = 1; i <= 25; i++) {
      const videoContainer = document.getElementById(`video${i}`);
      const clonedVideoElement = sourceVideoElement.cloneNode(true);
      videoContainer.appendChild(clonedVideoElement);
    }
  </script>
</body>
</html>
